# Generated by praisonaiui.mkdocs_import from mkdocs.yml.
# The MkDocs file is left unchanged. aiui build reads this file.
# Dropped: ignored YAML tag !!python/name:pymdownx.superfences.fence_code_format
schemaVersion: 1
site:
  title: PraisonAI SVC
  ui: shadcn
  theme:
    preset: indigo
    darkMode: true
  description: A unified framework that turns any PraisonAI Python package into a
    web service on Azure
seo:
  siteUrl: https://svc.praison.ai
navigation:
  tabs:
  - tab: Home
    groups:
    - group: Home
      pages:
      - index
  - tab: Getting Started
    groups:
    - group: Getting Started
      pages:
      - getting-started/installation
      - getting-started/deployment
      prefix: getting-started
  - tab: Features
    groups:
    - group: Features
      pages:
      - features/service-app
      - features/azure
      - features/cli
      - features/reliability
      prefix: features
navbar:
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/PraisonAI-SVC
footer:
  socials:
    github: https://github.com/MervinPraison/PraisonAI-SVC
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: docs
    include:
    - '**/*.md'
    - '**/*.mdx'
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: PraisonAI SVC
  footer_main:
    type: Footer
    props:
      text: PraisonAI SVC
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
